name = "dama-2026"
version = "0.1.0"
defaultTargets = ["Slides", "dama-2026"]

# Presentation introducing Lean 4 at the V SEEMAp (FGV EMAp, 2026-10-21),
# adapted from the Georgia Tech CSLib talk (arademaker/gatech-2026), whose
# build it keeps. Built with verso-slides, which renders a reveal.js deck
# from a Verso `Slides` document.
#
# The pins moved from the Georgia Tech ones (v4.35.0-rc3) to v4.36.0-rc1 on
# 2026-10-20, to show CSLib's latest release; the slides, the quoted CSLib
# source and every message the live demo relies on were checked to come out
# the same. The revision has to match `lean-toolchain` (v4.36.0-rc1): this is
# verso-slides `main` on 2026-10-14, which already carries SubVerso 892d6dc,
# whose `highlighted` facet no longer lets each module's build clobber a
# shared trace (SubVerso #244). Do not switch to a moving
# `main`: verso-slides itself requires `verso` from an *unpinned* `main`,
# so a `lake update` can drag the whole project to a newer toolchain.
# `lake-manifest.json` is what freezes that transitive revision -- keep it
# versioned.
[[require]]
name = "verso-slides"
git = "https://github.com/leanprover/verso-slides.git"
rev = "2d8e2ccef9876efe8194a6818b46b64f37da515f"

[[lean_lib]]
name = "Slides"
# `Slides.lean` plus the slide modules under `Slides/`, which it includes.
globs = ["Slides", "Slides.+"]
# `leanLibCode` quotes CSLib source and checks it still matches
# the highlighted JSON of each quoted module. `make highlighted` is used instead
# of `needs` targets here to work around an upstream issue.

[[lean_exe]]
name = "dama-2026"
root = "Main"

# CSLib is the subject of the talk: the slides elaborate real `Cslib.*`
# definitions (CCS, HML, bisimulation, the time monad), so the library has
# to be a dependency and not just prose.
# Pinned by full SHA (not `main`) so the deck still builds on the day of
# the talk: the `v4.36.0-rc1` tag, whose `lean-toolchain` is the one
# `verso-slides` above requires.
[[require]]
name = "cslib"
scope = "leanprover"
rev = "6d9d11371bae527fa615a016da8111bbdeb36f7c"

# Mathlib already arrives transitively via `cslib`, but without a direct
# `[[require]]` Lake does not give Mathlib's version choices priority for
# the dependencies it shares with verso (`plausible`, `Cli`, `batteries`).
# Those stay pinned to older revisions and `lake exe cache get` then
# refuses to fetch, because the hashes would not match -- which means
# building Mathlib from source, in CI too. Has to stay last in the file.
# The revision is the one `cslib` itself pins.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "625d8914199bc567cca9b91f90e8e5afafa5ae51"
